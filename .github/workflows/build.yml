name: Build & Boot NixOS VMs

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read
  pull-requests: write

jobs:
  vm-boot-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: [desktop-mads, laptop-mads, server-mads]
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://mads256h.cachix.org https://nix-community.cachix.org https://hyprland.cachix.org
            extra-trusted-public-keys = mads256h.cachix.org-1:6kAAfDlu6DSFqADoOQzlkOPQKO1hoptBHgnJGnuEnkI= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= hyprland.cachix.org-1:a7pgxzMz7+chwVL3/pzj6jIBMioiJM7ypFP8PwtkuGc=
      
      - uses: cachix/cachix-action@v17
        with:
          name: mads256h
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Re-add other Cachix caches (cachix-action overwrites substituters)
        run: |
          mkdir -p ~/.config/nix
          cat >> ~/.config/nix/nix.conf <<'EOF'
            extra-substituters = https://nix-community.cachix.org https://hyprland.cachix.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= hyprland.cachix.org-1:a7pgxzMz7+chwVL3/pzj6jIBMioiJM7ypFP8PwtkuGc=
          EOF

      - name: Show effective Nix config
        run: nix show-config | grep -iE 'substitut|trusted'

      - name: Enable /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build toplevel system closure
        run: nix build ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel" -L -o result-toplevel --fallback

      - name: Build VM
        run: nix build ".#nixosConfigurations.${{ matrix.host }}.config.system.build.vm" -L -o result --fallback

      - name: Boot VM and check for sucessful boot
        run: |
          set -o pipefail
          RUNSCRIPT=$(ls result/bin/run-*-vm)
          QEMU_OPTS="-no-reboot" timeout 180 "$RUNSCRIPT" | tee vm.log

          if ! grep -q "CI_BOOT_OK" vm.log; then
            echo "VM did not reach the boot-success checkpoint."
            exit 1
          fi

          if grep -q "CI_UNITS_FAILED" vm.log; then
            echo "One or more systemd units failed to start. See below:"
            sed -n '/CI_UNITS_FAILED/,/CI_BOOT_OK/p' vm.log
            exit 1
          fi

          if grep -q "CI_HYPR_NOT_STARTED" vm.log; then
            echo "Hyprland never started."
            exit 1
          fi

          if grep -q "CI_HYPR_ERRORS_FOUND" vm.log; then
            echo "Hyprland logged errors:"
            sed -n '/CI_HYPR_ERRORS_FOUND/,/CI_BOOT_OK/p' vm.log
            exit 1
          fi

          echo "Boot, units, and Hyprland all clean."

      - name: Checkout base and head revisions
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Build base system for nvd
        if: github.event_name == 'pull_request'
        id: vm_nvd_build
        run: |
          set -euo pipefail
          BASE_PATH=$(nix build "./base#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel" -L --fallback --no-link --print-out-paths)
          PR_PATH=$(readlink -f result-toplevel)
          echo "base_path=$BASE_PATH" >> "$GITHUB_OUTPUT"
          echo "pr_path=$PR_PATH" >> "$GITHUB_OUTPUT"

      - name: Diff with nvd
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          nix run nixpkgs#nvd -- diff "${{ steps.vm_nvd_build.outputs.base_path }}" "${{ steps.vm_nvd_build.outputs.pr_path }}" > nvd.out

      - name: Comment nvd output on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          MARKER="<!-- nvd-diff:${{ matrix.host }} -->"
          {
            echo "$MARKER"
            echo
            echo "### nvd package diff for \`${{ matrix.host }}\`"
            echo
            echo "Base: \`${{ github.event.pull_request.base.sha }}\`"
            echo "Head: \`${{ github.event.pull_request.head.sha }}\`"
            echo
            echo '```'
            sed -n '1,350p' nvd.out
            echo '```'
          } > comment.md
          COMMENT_BODY="$(cat comment.md)"
          COMMENTS_ENDPOINT="repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments"
          COMMENT_ID="$(gh api "$COMMENTS_ENDPOINT" --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"$MARKER\"))) | .id" | head -n 1 || true)"
          if [ -n "$COMMENT_ID" ]; then
            gh api --method PATCH "repos/${{ github.repository }}/issues/comments/$COMMENT_ID" --raw-field body="$COMMENT_BODY"
          else
            gh api --method POST "$COMMENTS_ENDPOINT" --raw-field body="$COMMENT_BODY"
          fi

  build-only:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: [wsl]
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://mads256h.cachix.org https://nix-community.cachix.org https://hyprland.cachix.org
            extra-trusted-public-keys = mads256h.cachix.org-1:6kAAfDlu6DSFqADoOQzlkOPQKO1hoptBHgnJGnuEnkI= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= hyprland.cachix.org-1:a7pgxzMz7+chwVL3/pzj6jIBMioiJM7ypFP8PwtkuGc=
      
      - uses: cachix/cachix-action@v17
        with:
          name: mads256h
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Re-add other Cachix caches (cachix-action overwrites substituters)
        run: |
          mkdir -p ~/.config/nix
          cat >> ~/.config/nix/nix.conf <<'EOF'
            extra-substituters = https://nix-community.cachix.org https://hyprland.cachix.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= hyprland.cachix.org-1:a7pgxzMz7+chwVL3/pzj6jIBMioiJM7ypFP8PwtkuGc=
          EOF

      - name: Show effective Nix config
        run: nix show-config | grep -iE 'substitut|trusted'

      - name: Build toplevel system closure
        run: nix build ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel" -L -o result-toplevel --fallback

      - name: Checkout base and head revisions
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Build base system for nvd
        if: github.event_name == 'pull_request'
        id: build_only_nvd_build
        run: |
          set -euo pipefail
          BASE_PATH=$(nix build "./base#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel" -L --fallback --no-link --print-out-paths)
          PR_PATH=$(readlink -f result-toplevel)
          echo "base_path=$BASE_PATH" >> "$GITHUB_OUTPUT"
          echo "pr_path=$PR_PATH" >> "$GITHUB_OUTPUT"

      - name: Diff with nvd
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          nix run nixpkgs#nvd -- diff "${{ steps.build_only_nvd_build.outputs.base_path }}" "${{ steps.build_only_nvd_build.outputs.pr_path }}" > nvd.out

      - name: Comment nvd output on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          MARKER="<!-- nvd-diff:${{ matrix.host }} -->"
          {
            echo "$MARKER"
            echo
            echo "### nvd package diff for \`${{ matrix.host }}\`"
            echo
            echo "Base: \`${{ github.event.pull_request.base.sha }}\`"
            echo "Head: \`${{ github.event.pull_request.head.sha }}\`"
            echo
            echo '```'
            sed -n '1,350p' nvd.out
            echo '```'
          } > comment.md
          COMMENT_BODY="$(cat comment.md)"
          COMMENTS_ENDPOINT="repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments"
          COMMENT_ID="$(gh api "$COMMENTS_ENDPOINT" --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"$MARKER\"))) | .id" | head -n 1 || true)"
          if [ -n "$COMMENT_ID" ]; then
            gh api --method PATCH "repos/${{ github.repository }}/issues/comments/$COMMENT_ID" --raw-field body="$COMMENT_BODY"
          else
            gh api --method POST "$COMMENTS_ENDPOINT" --raw-field body="$COMMENT_BODY"
          fi
